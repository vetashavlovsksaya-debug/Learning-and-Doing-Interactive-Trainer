<header class="hero"><div class="header-row"><div><div class="overline">E8 · Exam skills trainer</div><h1>Learning and Doing</h1><p>Unit 6 · Destination B1 · vocabulary, word patterns, word formation &amp; reading</p></div><span class="unit-badge">Learn · Practise · Progress</span></div></header>

<script>
const BANK={"passages": {"question_box": {"title": "The Question Box", "text": "When Mr Hall placed a large cardboard box outside Room 12, the students thought it was for lost property. They soon discovered it was a place to leave questions they were too embarrassed to ask in class.\n\nStudents wrote their questions on small pieces of paper. They did not have to write their names. Every Friday, a team of volunteers sorted the questions into topics, and teachers recorded short video answers. Most questions were about maths, English and revision techniques.\n\nDuring the first week, the box contained only seven notes. A month later, there were more than fifty. One student asked why making a mistake in front of classmates felt so frightening.\n\nMr Hall says the project changed the teachers, too. “We used to think a quiet class meant everyone understood,” he explains. “Now we know that some students stay silent because they don't want to look foolish.” The school has since introduced a weekly session where older students help younger pupils work through their questions."}, "revision_buddies": {"title": "The Revision Buddies Project", "text": "At Riverside School, the library has become a busier place since the launch of Revision Buddies. Twice a week, older students spend fifteen minutes helping younger pupils with difficult homework or exam revision.\n\nThe volunteers are not allowed to simply give the right answers. Instead, they ask questions, demonstrate study techniques and show younger pupils where to find reliable information. Sessions take place on Tuesdays and Thursdays after lunch.\n\nEmma, a Year 8 volunteer, admits that the first session was harder than she expected. A younger boy asked her a science question she couldn't answer. She checked a school reference book with him and then they worked it out together. “I realised you don't have to know everything to help someone learn,” she says.\n\nAt first, only eight students came to the revision desk. After six weeks, more than thirty pupils were using it. The teachers hope the project will make younger students more confident about solving problems themselves. “Getting a correct answer is great,” says the librarian, “but learning how to find one is even better.”"}}, "practice": [{"kind": "mc", "cat": "Topic vocabulary", "prompt": "There are eight lessons in this photography ___.", "options": ["mark", "course", "subject"], "correct": 1, "explanation": "A course is a series of lessons on a particular topic.", "hint": "Think of a series of classes.", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "You need good communication ___ to work with customers.", "options": ["skills", "terms", "marks"], "correct": 0, "explanation": "Skills are abilities you can develop through practice.", "hint": "Abilities you learn.", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "We have a short science ___ at the end of the term.", "options": ["talent", "exam", "experience"], "correct": 1, "explanation": "An exam tests what students know or can do.", "hint": "A formal test.", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "Ms Brown will ___ our essays and give them back on Monday.", "options": ["mark", "guess", "wonder"], "correct": 0, "explanation": "To mark work means to check and give it a grade or score.", "hint": "Teachers do this after a test.", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "I ___ whether the new timetable will make school less stressful.", "options": ["revise", "wonder", "achieve"], "correct": 1, "explanation": "Wonder means to think or ask yourself about something.", "hint": "Think about a question.", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "I need to ___ chapters four and five before the history test.", "options": ["revise", "conclude", "fail"], "correct": 0, "explanation": "Revise means study something again, usually before an exam.", "hint": "Review material already studied.", "passage": null}, {"kind": "mc", "cat": "Phrasal verbs", "prompt": "We ___ of whiteboard markers during the lesson.", "options": ["ran out", "looked up", "pointed out"], "correct": 0, "explanation": "Run out of something = have none left.", "hint": "There were no markers left.", "passage": null}, {"kind": "mc", "cat": "Phrasal verbs", "prompt": "Alex tore his old, incorrect plan into pieces. He ___.", "options": ["rubbed it out", "ripped it up", "read it out"], "correct": 1, "explanation": "Rip up means tear paper into pieces.", "hint": "Tearing something into pieces.", "passage": null}, {"kind": "input", "cat": "Phrasal verbs", "prompt": "Complete with TWO words: “Please ___ ___ the page number so we can find it later.”", "answers": ["write down", "jot down"], "explanation": "Write down = record information in writing. “Jot down” is also natural English, although Destination uses “write down”.", "hint": "You use a notebook.", "passage": null}, {"kind": "input", "cat": "Phrasal verbs", "prompt": "Complete with TWO words: “Could you ___ ___ the instructions to the group? They can’t see the screen.”", "answers": ["read out"], "explanation": "Read out means say written words aloud for others to hear.", "hint": "Say them aloud.", "passage": null}, {"kind": "input", "cat": "Phrasal verbs", "prompt": "Complete with TWO words: “Please ___ ___ the words you don’t need, but keep the rest of the sentence.”", "answers": ["cross out"], "explanation": "Cross out = draw a line through written material.", "hint": "Draw a line through the words.", "passage": null}, {"kind": "mc", "cat": "Phrasal verbs", "prompt": "Before you submit the report, ask someone to ___ any errors you missed.", "options": ["point out", "run out", "rip up"], "correct": 0, "explanation": "Point out means draw attention to something.", "hint": "Identify errors for you.", "passage": null}, {"kind": "input", "cat": "Prepositional phrases", "prompt": "Complete with ONE word: “We learnt the dialogue ___ heart.”", "answers": ["by"], "explanation": "By heart means from memory.", "hint": "From memory.", "passage": null}, {"kind": "input", "cat": "Prepositional phrases", "prompt": "Complete with ONE word: “___ general, students enjoy learning through games.”", "answers": ["in"], "explanation": "In general = usually or in most cases.", "hint": "A general statement.", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “It can be hard to cope ___ several tests in the same week.”", "answers": ["with"], "explanation": "The expression is cope with something.", "hint": "This word follows cope.", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “Nora is really talented ___ solving puzzles.”", "answers": ["at"], "explanation": "The pattern is talented at doing something.", "hint": "A skill someone is good at.", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “Are you capable ___ organising the trip yourself?”", "answers": ["of"], "explanation": "The pattern is capable of + noun / -ing.", "hint": "A standard collocation.", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “The class succeeded ___ finding the missing information.”", "answers": ["in"], "explanation": "The pattern is succeed in + noun / -ing.", "hint": "Remember: succeed ___ doing.", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of SILENCE: “The class fell completely ___ when the head teacher entered.”", "answers": ["silent"], "explanation": "Silence (noun) → silent (adjective).", "hint": "You need an adjective.", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of SIMPLE: “Can you ___ these instructions for younger learners?”", "answers": ["simplify"], "explanation": "Simple (adjective) → simplify (verb).", "hint": "You need a verb.", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of BRAVE: “It took real ___ to admit that he needed help.”", "answers": ["bravery"], "explanation": "Brave (adjective) → bravery (noun).", "hint": "You need a noun.", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of DIVIDE: “Long ___ makes some maths questions difficult.”", "answers": ["division"], "explanation": "Divide (verb) → division (noun).", "hint": "A mathematical operation.", "passage": null}, {"kind": "mc", "cat": "Reading · Main idea", "prompt": "Why did Mr Hall introduce the box?", "options": ["To collect lost belongings", "To let students ask questions anonymously", "To test how many questions students could answer"], "correct": 1, "explanation": "The box was for questions students felt too embarrassed to ask aloud.", "hint": "Read the first paragraph.", "passage": "question_box"}, {"kind": "input", "cat": "Reading · Detail", "prompt": "On which day were the questions sorted?", "answers": ["friday", "on friday", "every friday", "on fridays"], "explanation": "The volunteers sorted the questions every Friday.", "hint": "Find the day mentioned in the second paragraph.", "passage": "question_box"}, {"kind": "mc", "cat": "Reading · Detail", "prompt": "How did the number of notes change?", "options": ["It dropped from fifty to seven", "It stayed almost the same", "It grew from seven to over fifty"], "correct": 2, "explanation": "There were seven notes in week one and more than fifty a month later.", "hint": "Compare the first week with one month later.", "passage": "question_box"}, {"kind": "self", "cat": "Reading · Open answer", "prompt": "What did Mr Hall realise about quiet students?", "model": "Some pupils stay silent because they are afraid of looking foolish, even when they do not understand.", "checklist": "The answer explains that silence does NOT necessarily mean understanding.", "explanation": "The teachers stopped treating a quiet class as proof that everyone understood.", "hint": "Find Mr Hall’s quotation near the end.", "passage": "question_box"}, {"kind": "mc", "cat": "Reading · Inference", "prompt": "Which conclusion best matches the article?", "options": ["Asking questions can be an important part of learning", "Teachers should stop giving any homework", "An anonymous box can replace every lesson"], "correct": 0, "explanation": "The project made it easier for pupils to ask questions and get help.", "hint": "Think about the purpose of the whole project.", "passage": "question_box"}], "exam": [{"kind": "mc", "cat": "Topic vocabulary", "prompt": "Leah hopes to ___ her goal of studying medicine.", "options": ["achieve", "gain", "mark"], "correct": 0, "explanation": "Achieve a goal is the target collocation.", "hint": "", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "The chemistry teacher asked us to write a short ___ about our experiment.", "options": ["report", "term", "mark"], "correct": 0, "explanation": "A report describes findings or events.", "hint": "", "passage": null}, {"kind": "mc", "cat": "Topic vocabulary", "prompt": "The students are making steady ___ in maths this term.", "options": ["skill", "progress", "qualification"], "correct": 1, "explanation": "Make progress is a fixed collocation.", "hint": "", "passage": null}, {"kind": "input", "cat": "Phrasal verbs", "prompt": "Complete with TWO words: “The printer has ___ ___ of ink.”", "answers": ["run out"], "explanation": "Run out of = have none left.", "hint": "", "passage": null}, {"kind": "input", "cat": "Phrasal verbs", "prompt": "Complete with TWO words: “Please ___ ___ that pencil mark with your eraser.”", "answers": ["rub out"], "explanation": "Rub out is the target textbook phrasal verb.", "passage": null}, {"kind": "mc", "cat": "Phrasal verbs", "prompt": "Which sentence is correct?", "options": ["Could you look up this word in a dictionary?", "Could you look this word down in a dictionary?", "Could you look at up this word in a dictionary?"], "correct": 0, "explanation": "Look up information = search for it.", "hint": "", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “I have a question ___ the homework deadline.”", "answers": ["about"], "explanation": "A question about something.", "hint": "", "passage": null}, {"kind": "input", "cat": "Word patterns", "prompt": "Complete with ONE word: “Could you help me ___ the new science display?”", "answers": ["with"], "explanation": "Help somebody with something.", "hint": "", "passage": null}, {"kind": "input", "cat": "Prepositional phrases", "prompt": "Complete with ONE word: “___ conclusion, our experiment was a success.”", "answers": ["in"], "explanation": "In conclusion introduces a final point.", "hint": "", "passage": null}, {"kind": "input", "cat": "Prepositional phrases", "prompt": "Complete with TWO words: “Some hobbies help you concentrate; ___ ___, playing chess.”", "answers": ["for instance", "for example"], "explanation": "For instance / for example both introduce examples.", "hint": "", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of INSTRUCT: “Our swimming ___ demonstrated the technique.”", "answers": ["instructor"], "explanation": "Instructor is a person who teaches a skill.", "hint": "", "passage": null}, {"kind": "input", "cat": "Word formation", "prompt": "Complete with the form of EDUCATE: “Everyone should have access to a good ___.”", "answers": ["education"], "explanation": "Education is the noun formed from educate.", "hint": "", "passage": null}, {"kind": "mc", "cat": "Exam language", "prompt": "Choose the most natural reply.\n— I can’t remember the dates for the history test.\n— ___", "options": ["Why don’t you make a timeline?", "You should write the exam in summer.", "You have achieved a qualification."], "correct": 0, "explanation": "The speaker gives a relevant study suggestion.", "hint": "", "passage": null}, {"kind": "mc", "cat": "Reading · Purpose", "prompt": "Why does Riverside School run Revision Buddies?", "options": ["To help pupils become independent learners", "To replace homework with games", "To give all pupils the correct answers"], "correct": 0, "explanation": "Volunteers teach how to solve problems instead of giving answers.", "hint": "", "passage": "revision_buddies"}, {"kind": "input", "cat": "Reading · Detail", "prompt": "On which two days do the sessions take place?", "answers": ["tuesday and thursday", "tuesdays and thursdays", "on tuesdays and thursdays", "on tuesday and thursday", "thursday and tuesday", "thursdays and tuesdays", "on thursdays and tuesdays"], "explanation": "The sessions take place on Tuesdays and Thursdays after lunch.", "hint": "", "passage": "revision_buddies"}, {"kind": "mc", "cat": "Reading · Detail", "prompt": "What happened in Emma’s first session?", "options": ["She gave the boy the answer immediately", "She looked for information with him", "She refused to help with science"], "correct": 1, "explanation": "Emma consulted a reference book with the boy and they solved it together.", "hint": "", "passage": "revision_buddies"}, {"kind": "input", "cat": "Reading · Detail", "prompt": "How many pupils used the revision desk after six weeks?", "answers": ["more than thirty", "over thirty", "over 30", "more than 30", "30+", "over thirty pupils", "more than thirty pupils"], "explanation": "After six weeks, more than thirty pupils were using it.", "hint": "", "passage": "revision_buddies"}, {"kind": "self", "cat": "Reading · Open answer", "prompt": "Why might younger pupils become more independent after using Revision Buddies?", "model": "They practise finding reliable information and solving problems rather than simply copying answers.", "checklist": "Your answer includes BOTH learning a method and not depending on ready-made answers.", "explanation": "The project encourages const $=id=>document.getElementById(id);
const state={mode:'practice',idx:0,answers:[],checks:[],finished:false,waitingJudgement:false};
const getQs=()=>BANK[state.mode];
function norm(x){return String(x??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.?!,:;]+$/g,'').replace(/\s+/g,' ')}
function isCorrect(q,a){if(q.kind==='mc') return Number(a)===q.correct; if(q.kind==='input') return q.answers.some(x=>norm(x)===norm(a)); return false}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function expected(q){return q.kind==='mc'?q.options[q.correct]:q.kind==='input'?q.answers[0]:q.model}
function setMode(mode){state.mode=mode;state.idx=0;state.answers=[];state.checks=[];state.finished=false;state.waitingJudgement=false;
$('practiceTab').classList.toggle('active',mode==='practice');$('examTab').classList.toggle('active',mode==='exam');$('end').classList.add('hidden');$('card').classList.remove('hidden');render()}
function render(){const qs=getQs(),q=qs[state.idx],idx=state.idx;
$('progressLabel').textContent=`${idx+1} / ${qs.length}`;$('fill').style.width=`${Math.round(idx/qs.length*100)}%`;$('scoreLabel').textContent=state.mode==='practice'?`✓ ${state.checks.filter(Boolean).length}`:'Exam conditions';
$('category').textContent=q.cat;$('modeLabel').textContent=state.mode==='practice'?'Learn from every answer':'No hints until the end';
$('prompt').textContent=q.prompt;const passage=$('passage');const layout=$('questionLayout');
if(q.passage){const obj=BANK.passages[q.passage];passage.innerHTML=`<h3>${escapeHtml(obj.title)}</h3>`+obj.text.split(/\n\n/).map(p=>`<p>${escapeHtml(p)}</p>`).join('');passage.classList.remove('hidden');layout.classList.add('reading')}else{passage.classList.add('hidden');layout.classList.remove('reading')}
$('answerForm').innerHTML='';$('hint').classList.add('hidden');$('feedback').classList.add('hidden');$('judge').classList.add('hidden');$('nextButton').classList.add('hidden');$('checkButton').classList.remove('hidden');
$('hintButton').classList.toggle('hidden',state.mode==='exam');$('inputHelp').classList.toggle('hidden',q.kind==='mc');
if(q.kind==='mc'){q.options.forEach((opt,i)=>{let el=document.createElement('label');el.className='opt';el.innerHTML=`<input type="radio" name="choice" value="${i}"/><span><b>${'ABC'[i]}.</b> ${escapeHtml(opt)}</span>`;$('answerForm').append(el)})}
else{let input=q.kind==='self'?document.createElement('textarea'):document.createElement('input');if(q.kind==='input')input.type='text';input.id='typed';input.name='typed';input.className='answerbox'+(q.kind==='self'?' long':'');input.placeholder=q.kind==='self'?'Write your answer in your own words…':'Type your answer…';$('answerForm').append(input)}
$('inputHelp').textContent=q.kind==='self'?'This open response can be phrased in different ways. Compare your answer with the model and decide whether the meaning is complete.':q.kind==='input'?'Type only the missing word(s). Natural alternative answers are accepted where appropriate.':'';
$('checkButton').textContent=state.mode==='exam'?(idx===qs.length-1?'Finish exam':'Save & next'):'Check answer';
}
function selectedAnswer(q){if(q.kind==='mc'){let r=document.querySelector('input[name=choice]:checked');return r?Number(r.value):null}return $('typed').value.trim()}
function showError(msg){let fb=$('feedback');fb.className='msg note';fb.textContent=msg}
$('hintButton').addEventListener('click',()=>{const q=getQs()[state.idx],h=$('hint');h.textContent=q.hint||'Think about the expression and its meaning in context.';h.classList.remove('hidden')});
$('answerForm').addEventListener('submit',e=>{e.preventDefault();$('checkButton').click()});
$('checkButton').addEventListener('click',()=>{
const q=getQs()[state.idx],a=selectedAnswer(q);if(a===null||a===''){showError('Choose or enter an answer first.');return}
state.answers[state.idx]=a;
if(state.mode==='exam'){state.checks[state.idx]=q.kind==='self'?null:isCorrect(q,a);if(state.idx===getQs().length-1)finish();else{state.idx++;render()}return}
$('checkButton').classList.add('hidden');$('hintButton').classList.add('hidden');
if(q.kind==='self'){const fb=$('feedback');fb.className='msg note';fb.innerHTML='<strong>Compare your answer:</strong><br>'+escapeHtml(q.model)+'<br><br><strong>Key idea:</strong> '+escapeHtml(q.checklist);$('judge').classList.remove('hidden');state.waitingJudgement=true;return}
const ok=isCorrect(q,a);state.checks[state.idx]=ok;const fb=$('feedback');fb.className='msg '+(ok?'correct':'wrong');fb.innerHTML=`<strong>${ok?'✓ Correct':'Not quite.'}</strong><br>${ok?'':`Expected: <strong>${escapeHtml(expected(q))}</strong><br>`}${escapeHtml(q.explanation)}`;$('nextButton').classList.remove('hidden');
});
function judgeAnswer(v){if(!state.waitingJudgement)return;state.checks[state.idx]=v;state.waitingJudgement=false;$('judge').classList.add('hidden');$('nextButton').classList.remove('hidden');}
$('judgeYes').addEventListener('click',()=>judgeAnswer(true));$('judgeNo').addEventListener('click',()=>judgeAnswer(false));
$('nextButton').addEventListener('click',()=>{state.idx++;if(state.idx>=getQs().length)finish();else render()});
function totalScore(){return state.checks.filter(x=>x===true).length}
function finish(){state.finished=true;$('card').classList.add('hidden');$('end').classList.remove('hidden');$('fill').style.width='100%';drawResults()}
function drawResults(){let qs=getQs();let pending=qs.filter((q,i)=>q.kind==='self'&&state.checks[i]===null).length;let result=$('end');const score=totalScore();const percent=Math.round(score/qs.length*100);$('progressLabel').textContent='Completed';$('scoreLabel').textContent=pending?`${pending} open answer to review`:`${score} / ${qs.length}`;
let heading=pending?`<p class="muted">${pending} open answer still needs your judgement. Read the model answer below and mark whether yours contains the key idea.</p>`:`<p class="muted">${percent}% · ${percent>=85?'Excellent!':percent>=70?'Good progress.':percent>=50?'Keep practising.':'Review the topics below and try again.'}</p>`;
let rows=qs.map((q,i)=>{const ok=state.checks[i];const a=state.answers[i];const status=ok===true?'✓':ok===false?'✕':'?';return `<details class="review-row" ${ok===null?'open':''}><summary><span class="${ok?'correcttxt':'wrongtxt'}">${status}</span> ${i+1}. ${escapeHtml(q.cat)}</summary><div class="inside"><strong>Question:</strong> ${escapeHtml(q.prompt)}\n<strong>Your answer:</strong> ${escapeHtml(q.kind==='mc'?q.options[a]:a)}\n<strong>Model answer:</strong> ${escapeHtml(expected(q))}\n${escapeHtml(q.explanation)}${q.kind==='self'?`<div style="margin-top:8px"><strong>Check:</strong> ${escapeHtml(q.checklist)}</div><div class="judge"><button type="button" class="btn ${ok===true?'primary':''}" data-judge="${i}" data-value="yes">✓ It covers the key idea</button><button type="button" class="btn ${ok===false?'primary':''}" data-judge="${i}" data-value="no">Needs work</button></div>`:''}</div></details>`}).join('');
result.innerHTML=`<div class="overline">${state.mode==='practice'?'Practice summary':'Exam summary'}</div><h2>${pending?'Review your open answer':'Your result'}</h2><div class="score">${score} <span style="font-size:26px;color:var(--muted)">/ ${qs.length}</span></div>${heading}<div class="review">${rows}</div><div class="actions"><button type="button" class="btn primary" id="repeat">Try again</button><button type="button" class="btn" id="switch">${state.mode==='practice'?'Go to Exam Mode':'Go to Practice Mode'}</button></div>`;
result.querySelectorAll('[data-judge]').forEach(btn=>btn.addEventListener('click',()=>{state.checks[Number(btn.dataset.judge)]=btn.dataset.value==='yes';drawResults()}));
$('repeat').addEventListener('click',()=>setMode(state.mode));$('switch').addEventListener('click',()=>setMode(state.mode==='practice'?'exam':'practice'));
}
$('practiceTab').addEventListener('click',()=>setMode('practice'));
$('examTab').addEventListener('click',()=>setMode('exam'));
$('restartButton').addEventListener('click',()=>setMode(state.mode));
setMode('practice');
</script></body></html>
